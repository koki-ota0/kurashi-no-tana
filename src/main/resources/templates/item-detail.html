<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${item.name + ' - 暮らしの棚'}">アイテム詳細</title>
    <style>
        :root {
            --background: #FAFAF8;
            --text-primary: #2C2C2A;
            --text-secondary: #7A7A76;
            --primary: #8B7355;
            --secondary: #C4B5A0;
            --success: #6B9E7F;
            --border: #E8E8E6;
            --surface: #F5F5F3;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 0; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); text-decoration: none; }
        nav a { color: var(--text-secondary); text-decoration: none; margin-left: 24px; }
        main { padding: 24px 0; }
        .detail-container { max-width: 800px; margin: 0 auto; }
        .back-link { color: var(--text-secondary); text-decoration: none; margin-bottom: 24px; display: inline-block; }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .item-title { font-size: 32px; margin-bottom: 8px; }
        .item-category-badge { background: var(--surface); padding: 6px 12px; border-radius: 6px; color: var(--text-secondary); }
        .item-actions { display: flex; gap: 12px; }
        .btn { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; text-decoration: none; font-size: 14px; }
        .btn-secondary { background: var(--secondary); color: var(--text-primary); }
        .btn-success { background: var(--success); color: white; }
        .no-image { width: 100%; height: 300px; background: var(--surface); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); margin-bottom: 32px; }
        .main-image { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin-bottom: 32px; }
        .info-section { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .info-row { display: flex; padding: 16px 0; border-bottom: 1px solid var(--border); }
        .info-row:last-child { border-bottom: none; }
        .info-label { width: 120px; color: var(--text-secondary); }
        .info-value { flex: 1; }
        .usage-section { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
        .section-title { font-size: 20px; margin-bottom: 20px; }
        .stat-value { font-size: 32px; font-weight: bold; color: var(--primary); }
        .stat-label { color: var(--text-secondary); font-size: 14px; }
        .scene-options { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
        .scene-option { padding: 8px 16px; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; }
        .scene-option.selected { background: var(--primary); border-color: var(--primary); color: white; }
        .usage-log-item { padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .usage-scene { background: var(--secondary); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .usage-date { color: var(--text-secondary); font-size: 14px; }
        .empty-logs { text-align: center; padding: 24px; color: var(--text-secondary); }
        .image-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .gallery-image { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: pointer; }
        .gallery-image:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="/" class="logo">暮らしの棚</a>
            <nav>
                <a href="/">ホーム</a>
                <a href="/items/new">アイテム登録</a>
                <a href="/discovery">発見</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="detail-container">
            <a href="/" class="back-link">← ホームに戻る</a>

            <div class="item-header">
                <div>
                    <h1 class="item-title" th:text="${item.name}">アイテム名</h1>
                    <span class="item-category-badge" th:text="${item.category}">カテゴリ</span>
                </div>
                <div class="item-actions">
                    <a th:href="@{/items/{id}/edit(id=${item.id})}" class="btn btn-secondary">編集</a>
                    <button class="btn btn-secondary" onclick="deleteItem()">削除</button>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(item.photoUrls)}" class="no-image">No Image</div>
            <img th:if="${!#lists.isEmpty(item.photoUrls)}" th:src="${item.photoUrls[0]}" class="main-image">

            <div th:if="${!#lists.isEmpty(item.photoUrls) && item.photoUrls.size() > 1}" class="image-gallery">
                <img th:each="photoUrl : ${item.photoUrls}" th:src="${photoUrl}" class="gallery-image" :onclick="showImage(this.src)">
            </div>

            <div class="info-section">
                <div class="info-row" th:if="${item.brand}">
                    <div class="info-label">ブランド</div>
                    <div class="info-value" th:text="${item.brand}">ブランド名</div>
                </div>
                <div class="info-row" th:if="${item.memo}">
                    <div class="info-label">メモ</div>
                    <div class="info-value" th:text="${item.memo}">メモ</div>
                </div>
                <div class="info-row">
                    <div class="info-label">登録日</div>
                    <div class="info-value" th:text="${#temporals.format(item.createdAt, 'yyyy年M月d日')}">2024年1月1日</div>
                </div>
            </div>

            <div class="usage-section">
                <h2 class="section-title">使用履歴</h2>
                <div style="margin-bottom: 24px;">
                    <div class="stat-value" th:text="${item.usageCount}">0</div>
                    <div class="stat-label">合計使用回数</div>
                </div>

                <p style="color: var(--text-secondary); margin-bottom: 8px;">使用シーンを選択:</p>
                <div class="scene-options">
                    <span class="scene-option" data-scene="朝食">朝食</span>
                    <span class="scene-option" data-scene="昼食">昼食</span>
                    <span class="scene-option" data-scene="夕食">夕食</span>
                    <span class="scene-option" data-scene="来客">来客</span>
                    <span class="scene-option" data-scene="飾り">飾り</span>
                </div>
                <button class="btn btn-success" onclick="recordUsage()">今日使った</button>

                <div th:if="${!#lists.isEmpty(usageLogs)}" style="margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px;">
                    <div th:each="log : ${usageLogs}" class="usage-log-item">
                        <span th:if="${log.usageScene}" class="usage-scene" th:text="${log.usageScene}">シーン</span>
                        <span class="usage-date" th:text="${#temporals.format(log.usedAt, 'yyyy/M/d HH:mm')}">2024/1/1 12:00</span>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(usageLogs)}" class="empty-logs">使用履歴はまだありません</div>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        const itemId = [[${item.id}]];
        let selectedScene = null;

        document.querySelectorAll('.scene-option').forEach(el => {
            el.addEventListener('click', function() {
                document.querySelectorAll('.scene-option').forEach(e => e.classList.remove('selected'));
                this.classList.add('selected');
                selectedScene = this.dataset.scene;
            });
        });

        function showImage(src) {
            document.querySelector('.main-image').src = src;
        }

        async function recordUsage() {
            try {
                const response = await fetch('/api/usage-logs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itemId: itemId, usageScene: selectedScene })
                });
                if (response.ok) location.reload();
                else alert('記録に失敗しました');
            } catch (error) { alert('エラーが発生しました'); }
        }

        async function deleteItem() {
            if (!confirm('このアイテムを削除しますか？')) return;
            try {
                const response = await fetch('/api/items/' + itemId, { method: 'DELETE' });
                if (response.ok) window.location.href = '/';
                else alert('削除に失敗しました');
            } catch (error) { alert('エラーが発生しました'); }
        }
    </script>
</body>
</html>

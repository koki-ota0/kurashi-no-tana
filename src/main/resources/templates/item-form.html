<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アイテム登録 - 暮らしの棚</title>
    <style>
        :root {
            --background: #FAFAF8;
            --text-primary: #2C2C2A;
            --text-secondary: #7A7A76;
            --primary: #8B7355;
            --border: #E8E8E6;
            --surface: #F5F5F3;
            --error: #C85A54;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 0; }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); text-decoration: none; }
        nav a { color: var(--text-secondary); text-decoration: none; margin-left: 24px; }
        main { padding: 24px 0; }
        .form-container { max-width: 600px; margin: 0 auto; }
        .page-title { font-size: 28px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 500; }
        .required { color: var(--error); margin-left: 4px; }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-textarea { min-height: 120px; resize: vertical; }
        .form-actions { display: flex; gap: 16px; margin-top: 32px; }
        .photo-upload-section {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .photo-upload-section:hover {
            border-color: var(--primary);
            background: var(--surface);
        }
        .photo-upload-section.dragging {
            border-color: var(--primary);
            background: var(--surface);
        }
        .photo-input { display: none; }
        .photo-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }
        .photo-item {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            background: var(--surface);
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(200, 90, 84, 0.9);
            color: white;
            border: none;
            border-radius: 4px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-item .remove-btn:hover {
            background: var(--error);
        }
        .upload-hint {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 8px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-cancel { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="/" class="logo">暮らしの棚</a>
            <nav>
                <a href="/">ホーム</a>
                <a href="/items/new">アイテム登録</a>
                <a href="/discovery">発見</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <h1 class="page-title">アイテム登録</h1>
            <form id="itemForm">
                <div class="form-group">
                    <label class="form-label">アイテム名<span class="required">*</span></label>
                    <input type="text" name="name" class="form-input" required maxlength="255">
                </div>
                <div class="form-group">
                    <label class="form-label">カテゴリ<span class="required">*</span></label>
                    <select name="category" class="form-select" required>
                        <option value="">選択してください</option>
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">カテゴリ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">ブランド / ショップ名</label>
                    <input type="text" name="brand" class="form-input" maxlength="255">
                </div>
                <div class="form-group">
                    <label class="form-label">メモ</label>
                    <textarea name="memo" class="form-textarea" placeholder="自由にメモを記入できます"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">画像</label>
                    <div id="photoUploadZone" class="photo-upload-section">
                        <div>📁 クリックまたはドラッグ＆ドロップで画像をアップロード</div>
                        <div class="upload-hint">対応形式: JPG, PNG, GIF, WebP｜最大10MB</div>
                    </div>
                    <input type="file" id="photoInput" class="photo-input" accept="image/*" multiple>
                    <div id="photoPreview" class="photo-preview"></div>
                </div>
                <div class="form-actions">
                    <a href="/" class="btn btn-cancel">キャンセル</a>
                    <button type="submit" class="btn btn-primary">登録する</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        let uploadedPhotoUrls = [];

        const uploadZone = document.getElementById('photoUploadZone');
        const photoInput = document.getElementById('photoInput');
        const photoPreview = document.getElementById('photoPreview');

        // クリックでファイル選択を開く
        uploadZone.addEventListener('click', () => photoInput.click());

        // ファイル選択時の処理
        photoInput.addEventListener('change', (e) => {
            handleFileSelect(e.target.files);
        });

        // ドラッグ&ドロップの処理
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragging');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragging');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragging');
            handleFileSelect(e.dataTransfer.files);
        });

        async function handleFileSelect(files) {
            for (const file of files) {
                // ファイルサイズチェック (10MB)
                if (file.size > 10485760) {
                    alert(`${file.name} は10MBを超えています`);
                    continue;
                }

                // 画像形式チェック
                if (!file.type.startsWith('image/')) {
                    alert(`${file.name} は画像ファイルではありません`);
                    continue;
                }

                // 画像をプレビュー表示
                const reader = new FileReader();
                reader.onload = (e) => {
                    addPhotoPreview(e.target.result, file.name);
                };
                reader.readAsDataURL(file);
            }
        }

        function addPhotoPreview(src, filename) {
            const item = document.createElement('div');
            item.className = 'photo-item';
            item.innerHTML = `<img src="${src}" alt="${filename}">
                            <button type="button" class="remove-btn">×</button>`;
            
            const removeBtn = item.querySelector('.remove-btn');
            removeBtn.addEventListener('click', () => {
                item.remove();
            });

            photoPreview.appendChild(item);
        }

        document.getElementById('itemForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            // 選択されたファイルをアップロード
            const files = photoInput.files;
            const photoUrls = [...uploadedPhotoUrls];

            for (const file of files) {
                try {
                    // 画像ファイルをアップロード
                    const uploadFormData = new FormData();
                    uploadFormData.append('file', file);

                    const uploadResponse = await fetch(`/api/items/0/upload-image`, {
                        method: 'POST',
                        body: uploadFormData
                    });

                    if (uploadResponse.ok) {
                        const uploadData = await uploadResponse.json();
                        photoUrls.push(uploadData.photoUrl);
                    }
                } catch (error) {
                    console.error('画像アップロードエラー:', error);
                }
            }

            const data = {
                name: formData.get('name'),
                category: formData.get('category'),
                brand: formData.get('brand') || null,
                memo: formData.get('memo') || null,
                photoUrls: photoUrls
            };

            try {
                const response = await fetch('/api/items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    alert('登録に失敗しました');
                }
            } catch (error) {
                alert('エラーが発生しました');
                console.error(error);
            }
        });
    </script>
</body>
</html>

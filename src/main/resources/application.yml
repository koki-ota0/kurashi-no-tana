spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kurashi}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML

server:
  port: ${SERVER_PORT:8080}
